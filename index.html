<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WanSnap — Extract Screenshots from Video | Free, No Upload</title>
    <meta
      name="description"
      content="Grab high quality screenshots from any video, free and without uploading. Runs entirely in your browser — your footage never leaves your device. MP4, MOV and WebM, no signup, no watermark."
    />
    <link rel="canonical" href="https://adenijiridwan43.github.io/WanSnap/" />

    <!-- Open Graph: controls how a shared link renders in Slack, Discord, iMessage
         and most chat apps. Without this the link previews as a blank card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WanSnap" />
    <meta property="og:title" content="WanSnap — Free Video Screenshot Extractor" />
    <meta
      property="og:description"
      content="Extract screenshots from any video instantly in your browser. Your video is never uploaded. Free, private, no watermark."
    />
    <meta property="og:url" content="https://adenijiridwan43.github.io/WanSnap/" />
    <meta property="og:image" content="https://adenijiridwan43.github.io/WanSnap/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WanSnap — video to screenshots in your browser" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WanSnap — Free Video Screenshot Extractor" />
    <meta
      name="twitter:description"
      content="Extract screenshots from any video without uploading it. Runs in your browser, free, no watermark."
    />
    <meta name="twitter:image" content="https://adenijiridwan43.github.io/WanSnap/og-image.png" />

    <meta name="theme-color" content="#E8734A" />
    <!-- %BASE_URL% keeps these pointing at the deploy subpath, e.g. /WanSnap/. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
