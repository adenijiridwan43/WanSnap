<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WanSnap — Free Video Screenshot Extractor | No Upload</title>

      content="Turn any video into high quality screenshots, right in your browser. Nothing is uploaded. Free, private and instant — works with MP4, MOV and WebM."
    />

    <!-- Open Graph: controls how a shared link renders in Slack, Discord, iMessage

    <meta property="og:site_name" content="WanSnap" />
    <meta property="og:title" content="WanSnap — Free Video Screenshot Extractor" />
    <meta
      property="og:description"
      content="Extract screenshots from any video instantly in your browser. No upload, no signup, no limits."
    />
    <meta property="og:url" content="https://wansnap.app/" />
    <meta property="og:image" content="https://wansnap.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WanSnap — video to screenshots in your browser" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WanSnap — Free Video Screenshot Extractor" />
    <meta
      name="twitter:description"
      content="Extract screenshots from any video instantly in your browser. No upload, no signup."
    />
    <meta name="twitter:image" content="https://wansnap.app/og-image.png" />

    <meta name="theme-color" content="#E8734A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
