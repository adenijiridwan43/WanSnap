<!doctype html>
<!--
  Source of truth for the app icons. Rendered headlessly to PNG by
  scripts/generate-icons.mjs, so the SVG here and the shipped PNGs can never
  drift apart. Edit this file, then re-run the script.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WanSnap icons</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #ffffff;
        display: flex;
        align-items: flex-start;
        gap: 24px;
        padding: 0;
      }
      .icon { display: block; }
    </style>
  </head>
  <body>
    <svg class="icon" id="i192" width="192" height="192" viewBox="0 0 32 32">
      <defs>
        <linearGradient id="g192" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFF0E8" />
          <stop offset="100%" stop-color="#F09468" />
        </linearGradient>
      </defs>
      <rect width="32" height="32" fill="#FFF8F2" />
      <circle cx="16" cy="16" r="14" fill="url(#g192)" />
      <circle cx="16" cy="16" r="13" fill="none" stroke="#E8734A" stroke-width="1.3" />
      <circle cx="16" cy="16" r="5.2" fill="#E8734A" />
      <line x1="16" y1="1.8" x2="16" y2="5.8" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" />
      <line x1="16" y1="26.2" x2="16" y2="30.2" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" />
    </svg>

    <svg class="icon" id="i512" width="512" height="512" viewBox="0 0 32 32">
      <defs>
        <linearGradient id="g512" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFF0E8" />
          <stop offset="100%" stop-color="#F09468" />
        </linearGradient>
      </defs>
      <rect width="32" height="32" fill="#FFF8F2" />
      <circle cx="16" cy="16" r="14" fill="url(#g512)" />
      <circle cx="16" cy="16" r="13" fill="none" stroke="#E8734A" stroke-width="1.3" />
      <circle cx="16" cy="16" r="5.2" fill="#E8734A" />
      <line x1="16" y1="1.8" x2="16" y2="5.8" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" />
      <line x1="16" y1="26.2" x2="16" y2="30.2" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  </body>
</html>
