<!doctype html>
<!--
  Renders the Open Graph card to a PNG at exactly 1200x630.
  Open this file in a browser, then use the "Download" button. Keeping the card
  as HTML+CSS (rather than drawing it with a graphics API) means the design can
  be edited directly and the exported PNG always matches what ships.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image · WanSnap</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #e9e4e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 30px;
      }

      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(160deg, #fff0e8 0%, #fff8f2 55%, #ffffff 100%);
        position: relative;
        overflow: hidden;
      }

      /* Soft warm glow behind the mark, kept subtle so text stays legible. */
      .card::before {
        content: "";
        position: absolute;
        top: -180px;
        left: 50%;
        transform: translateX(-50%);
        width: 760px;
        height: 560px;
        background: radial-gradient(closest-side, rgba(232, 115, 74, 0.16), transparent 70%);
      }

      .mark { position: relative; width: 168px; height: 168px; }

      h1 {
        position: relative;
        font-size: 88px;
        font-weight: 800;
        color: #e8734a;
        letter-spacing: -1.5px;
        line-height: 1;
      }

      p {
        position: relative;
        font-size: 38px;
        font-weight: 400;
        color: #2d2d3a;
        text-align: center;
      }

      .badge {
        position: relative;
        margin-top: 12px;
        padding: 16px 40px;
        border-radius: 999px;
        background: linear-gradient(135deg, #e8734a, #f09468);
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .actions { display: flex; gap: 10px; }
      button {
        padding: 10px 20px;
        border-radius: 10px;
        border: 1px solid #d8cec7;
        background: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #f5f0ec; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="mark">
        <svg width="168" height="168" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFF0E8" />
              <stop offset="100%" stop-color="#F09468" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="14.5" fill="url(#g)" />
          <circle cx="16" cy="16" r="13" fill="none" stroke="#E8734A" stroke-width="1.4" />
          <circle cx="16" cy="16" r="5.5" fill="#E8734A" />
          <line x1="16" y1="1.5" x2="16" y2="6" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" />
          <line x1="16" y1="26" x2="16" y2="30.5" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </div>
      <h1>WanSnap</h1>
      <p>Video to screenshots, entirely in your browser.</p>
      <div class="badge">No upload &nbsp;·&nbsp; Free &nbsp;·&nbsp; Private</div>
    </div>

    <div class="actions">
      <button id="download">Download PNG (1200x630)</button>
    </div>

    <script type="module">
      // Uses the same drawing approach as the app's export code: render the
      // element to a canvas via an SVG foreignObject. Chromium and Firefox both
      // support this; Safari requires a fallback that is not needed here
      // because this file is a build-time helper, not part of the product.
      document.getElementById('download').addEventListener('click', async () => {
        const card = document.getElementById('card');
        const { width, height } = { width: 1200, height: 630 };

        const clone = card.cloneNode(true);
        clone.style.margin = '0';
        const xml = new XMLSerializer().serializeToString(clone);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">${xml}</div>
          </foreignObject>
        </svg>`;

        const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff8f2';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob((b) => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = 'og-image.png';
            a.click();
          }, 'image/png');
        };
        img.src = url;
      });
    </script>
  </body>
</html>
